                onClick={() => setActiveTab('saved')}
                className={`flex flex-col items-center justify-center py-1.5 transition-all relative ${
                  activeTab === 'saved' ? 'text-teal-500 font-bold scale-105' : 'hover:text-slate-900 dark:hover:text-white'
                }`}
              >
                <i data-lucide="bookmark" class="w-5 h-5"></i>
                <span className="text-[10px] mt-0.5">Saved</span>
                {savedFaqIds.length > 0 && (
                  <span className="absolute top-1 right-3.5 bg-amber-500 text-slate-950 font-black text-[9px] w-3.5 h-3.5 rounded-full flex items-center justify-center">
                    {savedFaqIds.length}
                  </span>
                )}
              </button>

              <button
                onClick={() => setActiveTab('tools')}
                className={`flex flex-col items-center justify-center py-1.5 transition-all ${
                  activeTab === 'tools' ? 'text-teal-500 font-bold scale-105' : 'hover:text-slate-900 dark:hover:text-white'
                }`}
              >
                <i data-lucide="compass" class="w-5 h-5"></i>
                <span className="text-[10px] mt-0.5">Tools</span>
              </button>

            </div>
          </nav>

        </div>
      );
    }

    const container = document.getElementById('root');
    const root = ReactDOM.createRoot(container);
    root.render(<App />);
  </script>
</body>
</html>
